# Tunnel configuration examples for yonder.
# (Versión en español: ejemplo.conf, en este mismo directorio.)
#
# Copy the block you need, uncomment it and adjust the values. Every address
# shown belongs to the ranges reserved for documentation (RFC 5737) and does
# not route anywhere.
#
# The file lives at ~/.ssh/config.d/yonder.conf and is read by OpenSSH, so
# the entries defined here also work with ssh, scp, rsync and any other
# client, with the application closed.
#
#
# ==========================================================================
# THE SCENARIO BEHIND THE EXAMPLES
#
#   A — this machine: the laptop where yonder runs.
#   B — jump server, one hop from A. Reached over SSH:
#           ssh user@192.0.2.10
#   C — internal server, two hops from A. ONLY B can reach it, and only on
#       port 1521 (Oracle). There is no direct route from A, not even SSH.
#
#       ┌───────┐  ssh   ┌───────┐  internal net  ┌───────┐
#       │   A   │ ─────▶ │   B   │ ─────────────▶ │   C   │
#       │ (you) │        │ jump  │     :1521      │ Oracle│
#       └───────┘        └───────┘                └───────┘
#
# THE ONE RULE THAT EXPLAINS EVERYTHING: the destination of a LocalForward
# is resolved FROM B, not from A. In "LocalForward 1521 192.0.2.30:1521",
# the address 192.0.2.30 is how B sees C. And "localhost" in a destination
# means B itself, never this machine.
#
#
# ==========================================================================
# STRUCTURE
#
# A single Host with several LocalForward lines opens ONE master connection
# and adds each forwarding on the fly with "-O forward". Authentication
# happens once, and enabling or disabling an individual forwarding is
# instantaneous. The alternative — one "ssh -f -N -L" process per tunnel —
# authenticates once per tunnel and leaves you supervising as many processes
# as forwardings.
#
# The "# nombre:", "# salud:" and "# nota:" lines are comments OpenSSH
# ignores; for the application they are the forwarding's display name, its
# health check and the host's description.
#
#
# ==========================================================================
# EXAMPLE 1 — A service on B, opened on A
#
# B runs a dashboard on port 3001 that only listens locally. This forwarding
# opens port 3001 on A and connects it to port 3001 on B: in A's browser,
# http://localhost:3001 is B's dashboard.
#
#   A :3001 ──▶ B :3001   ("localhost" = B itself)
#
# Host jump
#     HostName 192.0.2.10
#     User user
#     # nombre: b-dashboard
#     # salud: http:/api/health
#     LocalForward 3001 localhost:3001
#
#
# ==========================================================================
# EXAMPLE 2 — Oracle on C, going through B
#
# A cannot reach C; B can. The forwarding opens port 1521 on A and B bridges
# it to port 1521 on C. The database client on A points at localhost:1521
# and talks to C without knowing it.
#
#   A :1521 ──▶ B ──▶ C :1521   (192.0.2.30 is how B sees C)
#
# Oracle announces its version on connect, so the "banner" probe catches the
# zombie tunnel: the one that opens the port but transports nothing.
#
# Host jump
#     HostName 192.0.2.10
#     User user
#     # nombre: oracle-c
#     # salud: banner
#     LocalForward 1521 192.0.2.30:1521
#
# If a local Oracle on A already holds 1521, change the left-hand side
# ("LocalForward 1522 192.0.2.30:1521") and point the client at
# localhost:1522.
#
#
# ==========================================================================
# EXAMPLE 3 — SSH to another internal machine, via B
#
# Same mechanism with port 22 as the destination: opens port 2222 on A
# against the SSH daemon of a machine only B can see. Then:
#     ssh -p 2222 user@localhost
#
# Host jump
#     HostName 192.0.2.10
#     User user
#     # nombre: internal-ssh
#     # salud: banner
#     LocalForward 2222 192.0.2.40:22
#
#
# ==========================================================================
# EXAMPLE 4 — The other way round: showing a service on A to B (RemoteForward)
#
# A development server runs on A on port 3000 and someone with access to B
# needs to see it. The remote forwarding opens port 8080 ON B and brings it
# to port 3000 on A. In the destination, "localhost" is resolved from A: it
# is this machine.
#
#   B :8080 ──▶ A :3000
#
# Host jump
#     HostName 192.0.2.10
#     User user
#     # nombre: demo-for-b
#     RemoteForward 8080 localhost:3000
#
#
# ==========================================================================
# EXAMPLE 5 — B's whole network, without one tunnel per service (SOCKS)
#
# A DynamicForward turns B into a SOCKS proxy: A's browser, configured with
# a SOCKS5 proxy at localhost:1080, browses B's internal network as if it
# were there. Useful when there are many services and opening a
# LocalForward for each one is not worth it.
#
# Host jump
#     HostName 192.0.2.10
#     User user
#     # nombre: b-network
#     DynamicForward 1080
#
#
# ==========================================================================
# HEALTH CHECKS
#
# Without a mark, the only verification is that the local port is open,
# which does not prove the tunnel transports traffic.
#
#   (none)           Only checks that the local port accepts connections.
#   # salud: tcp     Opens a connection through the tunnel and closes it.
#   # salud: banner  Waits for the server's greeting. For services that
#                    announce their version before receiving data, such as
#                    SSH and Oracle Database.
#   # salud: http:/path
#                    Sends an HTTP request to the given path; any non-error
#                    response is accepted.
#
# The case that justifies the probes: a destination pointing at where the
# service is not listening — "localhost" when the service is bound to a
# specific IP alias — leaves the local port open while transporting nothing.
# The open-port check calls it healthy; "banner" and "http" do not.
#
#
# ==========================================================================
# SUPERVISION WITH THE APPLICATION CLOSED
#
#     yonder service install
#     loginctl enable-linger $USER
