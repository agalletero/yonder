# Ejemplos de configuración de túneles para yonder.
# (English version: example.conf, in this same directory.)
#
# Copiar el bloque que interese, descomentarlo y ajustar los valores. Las
# direcciones que aparecen pertenecen a los rangos reservados para
# documentación (RFC 5737) y no encaminan a ninguna parte.
#
# El fichero se ubica en ~/.ssh/config.d/yonder.conf y lo lee OpenSSH, de modo
# que las entradas definidas aquí funcionan también con ssh, scp, rsync y
# cualquier otro cliente, con la aplicación cerrada.
#
#
# ==========================================================================
# EL ESCENARIO DE LOS EJEMPLOS
#
#   A — este equipo: el portátil donde corre yonder.
#   B — servidor de salto, a un salto de A. Se llega por SSH:
#           ssh usuario@192.0.2.10
#   C — servidor interno, a dos saltos de A. SOLO B llega a él, y solo al
#       puerto 1521 (Oracle). Desde A no hay ruta directa, ni por SSH.
#
#       ┌───────┐  ssh   ┌───────┐  red interna   ┌───────┐
#       │   A   │ ─────▶ │   B   │ ─────────────▶ │   C   │
#       │ (tú)  │        │ salto │     :1521      │ Oracle│
#       └───────┘        └───────┘                └───────┘
#
# LA REGLA QUE LO EXPLICA TODO: el destino de un LocalForward se resuelve
# DESDE B, no desde A. En «LocalForward 1521 192.0.2.30:1521», la dirección
# 192.0.2.30 es como B ve a C. Y «localhost» en el destino significa el
# propio B, nunca este equipo.
#
#
# ==========================================================================
# ESTRUCTURA
#
# Un único Host con varios LocalForward abre UNA conexión maestra y añade
# cada reenvío en caliente mediante «-O forward». La autenticación ocurre una
# sola vez, y activar o desactivar un reenvío concreto es inmediato. La
# alternativa —un proceso «ssh -f -N -L» por túnel— autentica una vez por
# túnel y obliga a supervisar tantos procesos como reenvíos.
#
# Las líneas «# nombre:», «# salud:» y «# nota:» son comentarios que OpenSSH
# ignora; para la aplicación son el nombre visible del reenvío, su
# comprobación de salud y la descripción del host.
#
#
# ==========================================================================
# EJEMPLO 1 — Un servicio de B, abierto en A
#
# En B corre un panel en el puerto 3001 que solo escucha en local. Este
# reenvío abre el 3001 de A y lo conecta con el 3001 de B: en el navegador
# de A, http://localhost:3001 es el panel de B.
#
#   A :3001 ──▶ B :3001   («localhost» = el propio B)
#
# Host salto
#     HostName 192.0.2.10
#     User usuario
#     # nombre: panel-b
#     # salud: http:/api/health
#     LocalForward 3001 localhost:3001
#
#
# ==========================================================================
# EJEMPLO 2 — Oracle en C, pasando por B
#
# A no llega a C; B sí. El reenvío abre el 1521 de A y B hace de puente
# hasta el 1521 de C. El cliente de base de datos en A apunta a
# localhost:1521 y habla con C sin saberlo.
#
#   A :1521 ──▶ B ──▶ C :1521   (192.0.2.30 es como B ve a C)
#
# Oracle anuncia su versión al conectar, así que la sonda «banner» detecta
# el túnel zombi: el que abre el puerto pero no transporta.
#
# Host salto
#     HostName 192.0.2.10
#     User usuario
#     # nombre: oracle-c
#     # salud: banner
#     LocalForward 1521 192.0.2.30:1521
#
# Si en A ya hay un Oracle local ocupando el 1521, cambia el lado izquierdo
# («LocalForward 1522 192.0.2.30:1521») y apunta el cliente a localhost:1522.
#
#
# ==========================================================================
# EJEMPLO 3 — SSH a otra máquina interna, vía B
#
# Mismo mecanismo con destino al puerto 22: abre el 2222 de A contra el SSH
# de una máquina que solo B ve. Después:  ssh -p 2222 usuario@localhost
#
# Host salto
#     HostName 192.0.2.10
#     User usuario
#     # nombre: ssh-interno
#     # salud: banner
#     LocalForward 2222 192.0.2.40:22
#
#
# ==========================================================================
# EJEMPLO 4 — Al revés: enseñar un servicio de A en B (RemoteForward)
#
# Un desarrollo corre en A en el puerto 3000 y alguien con acceso a B tiene
# que verlo. El reenvío remoto abre el 8080 EN B y lo trae hasta el 3000 de
# A. En el destino, «localhost» se resuelve desde A: es este equipo.
#
#   B :8080 ──▶ A :3000
#
# Host salto
#     HostName 192.0.2.10
#     User usuario
#     # nombre: demo-para-b
#     RemoteForward 8080 localhost:3000
#
#
# ==========================================================================
# EJEMPLO 5 — Toda la red de B, sin un túnel por servicio (SOCKS)
#
# Un DynamicForward convierte a B en un proxy SOCKS: el navegador de A,
# configurado con proxy SOCKS5 en localhost:1080, navega por la red interna
# de B como si estuviera allí. Útil cuando hay muchos servicios y abrir un
# LocalForward por cada uno no compensa.
#
# Host salto
#     HostName 192.0.2.10
#     User usuario
#     # nombre: red-de-b
#     DynamicForward 1080
#
#
# ==========================================================================
# COMPROBACIONES DE SALUD
#
# Sin marca solo se verifica que el puerto local esté abierto, lo cual no
# acredita que el túnel transporte tráfico.
#
#   (ninguna)        Únicamente comprueba que el puerto local acepte
#                    conexiones.
#   # salud: tcp     Abre una conexión a través del túnel y la cierra.
#   # salud: banner  Espera el saludo inicial del servidor. Para servicios
#                    que anuncian su versión antes de recibir datos, como
#                    SSH y Oracle Database.
#   # salud: http:/ruta
#                    Petición HTTP contra la ruta indicada; vale cualquier
#                    respuesta que no sea de error.
#
# El caso que justifica las sondas: un destino que apunta a donde el
# servicio no escucha —«localhost» cuando el servicio está enganchado a un
# alias de IP concreto— deja el puerto local abierto sin transportar nada.
# La comprobación de puerto abierto lo da por bueno; «banner» y «http» no.
#
#
# ==========================================================================
# SUPERVISIÓN CON LA APLICACIÓN CERRADA
#
#     yonder service install
#     loginctl enable-linger $USER
