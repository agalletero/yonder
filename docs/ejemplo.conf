# Ejemplo de configuración de túneles para yonder.
#
# Copiar el bloque del final, descomentarlo y ajustar los valores marcados
# entre ángulos (<salto>, <usuario>, <servidor-...>) al entorno propio. Las
# direcciones que aparecen pertenecen a los rangos reservados para
# documentación (RFC 5737) y no encaminan a ninguna parte.
#
# El fichero se ubica en ~/.ssh/config.d/yonder.conf y lo lee OpenSSH, de modo
# que las entradas definidas aquí funcionan también con ssh, scp, rsync y
# cualquier otro cliente, con la aplicación cerrada.
#
#
# ESTRUCTURA
#
# Un único Host con varios LocalForward abre UNA conexión maestra y añade cada
# reenvío en caliente mediante «-O forward». La autenticación ocurre una sola
# vez, y activar o desactivar un reenvío concreto es inmediato. La alternativa
# —un proceso «ssh -f -N -L» por túnel— autentica una vez por túnel y obliga a
# supervisar tantos procesos como reenvíos.
#
#
# COMPROBACIONES DE SALUD
#
# Las líneas «# salud:» son comentarios para OpenSSH, que las ignora, y
# constituyen la especificación de la comprobación para esta aplicación. Sin
# ellas solo se verifica que el puerto local esté abierto, lo cual no acredita
# que el túnel transporte tráfico.
#
#   (ninguna)      Únicamente comprueba que el puerto local acepte conexiones.
#   # salud: tcp   Abre una conexión a través del túnel y la cierra.
#   # salud: banner
#                  Espera el saludo inicial del servidor. Aplicable a los
#                  servicios que anuncian su versión antes de recibir datos,
#                  como SSH y Oracle Database.
#   # salud: http:/ruta
#                  Emite una petición HTTP contra la ruta indicada y acepta
#                  cualquier respuesta que no sea de error.
#
#
# SUPERVISIÓN CON LA APLICACIÓN CERRADA
#
#     yonder service install
#     loginctl enable-linger $USER
#
#
# ------------------------------------------------------------------------
# A partir de aquí, copiar, descomentar y ajustar.
# ------------------------------------------------------------------------
#
# Host <salto>
#     HostName 192.0.2.10
#     User <usuario>
#     ExitOnForwardFailure yes
#     ServerAliveInterval 30
#     ServerAliveCountMax 3
#     TCPKeepAlive yes
#     ConnectTimeout 8
#
#     # Servicio de aplicación. Sin comprobación declarada: basta con que el
#     # puerto local acepte conexiones.
#     LocalForward 5001 192.0.2.20:5001
#
#     # Base de datos Oracle. El servidor emite un saludo al conectar, por lo
#     # que el banner sirve de comprobación.
#     # salud: banner
#     LocalForward 1522 192.0.2.30:1521
#
#     # Acceso SSH a un servidor interno. SSH también anuncia su versión antes
#     # de que el cliente envíe nada.
#     # salud: banner
#     LocalForward 2222 192.0.2.40:22
#
#     # Interfaz web servida en la propia máquina de salto.
#     # salud: http:/api/health
#     LocalForward 3001 localhost:3001
#
#     # Interfaz web asociada a un alias de IP, NO a localhost.
#     #
#     # Cuando la interfaz de red del salto atiende varias direcciones y el
#     # servicio se enlaza explícitamente a una de ellas, el reenvío debe
#     # apuntar a esa dirección. Dirigirlo a localhost establece el túnel —el
#     # puerto local queda a la escucha— sin que llegue ninguna petición al
#     # destino.
#     #
#     # Este es el supuesto que la comprobación de puerto abierto no detecta y
#     # la comprobación HTTP sí.
#     # salud: http:/api/health
#     LocalForward 3000 192.0.2.50:3000
#
#     # Servicio de métricas. El prefijo «1» en el puerto local evita la
#     # colisión con una instancia instalada en el equipo.
#     # salud: http:/-/healthy
#     LocalForward 19090 localhost:9090
#
#     # Gestor de alertas.
#     # salud: http:/-/healthy
#     LocalForward 19093 localhost:9093
